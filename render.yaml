services:
  - type: web
    name: nexora-staging
    repo: https://github.com/qbao0111/nexora-backend
    runtime: docker
    plan: free
    region: oregon
    branch: deploy/render-free-staging
    autoDeploy: false
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: DOTNET_ENVIRONMENT
        value: Staging
      - key: Features__Ai
        value: "true"
      - key: Features__Payment
        value: "true"
      - key: Features__Upload
        value: "true"
      - key: Ai__Provider
        value: gemini
      - key: Storage__Provider
        value: r2
      - key: Authentication__Jwt__Issuer
        value: Nexora.Api
      - key: Authentication__Jwt__Audience
        value: Nexora.Frontend
      - key: Authentication__RefreshCookie__SameSite
        value: None
      - key: Authentication__RefreshCookie__Secure
        value: "true"
      - key: Billing__Payment__Provider
        value: sepay
      - key: Billing__Sepay__Environment
        value: Sandbox
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Authentication__Jwt__SigningKey
        sync: false
      - key: Ai__Gemini__ApiKey
        sync: false
      - key: Ai__Gemini__Model
        sync: false
      - key: Storage__R2__AccountId
        sync: false
      - key: Storage__R2__Bucket
        sync: false
      - key: Storage__R2__AccessKeyId
        sync: false
      - key: Storage__R2__SecretAccessKey
        sync: false
      - key: Storage__R2__Endpoint
        sync: false
      - key: Billing__Sepay__MerchantId
        sync: false
      - key: Billing__Sepay__SecretKey
        sync: false
      - key: Email__Provider
        value: resend
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        value: Nexora
      - key: Email__Resend__ApiKey
        sync: false
      - key: Email__Resend__ApiBaseUrl
        value: https://api.resend.com
      - key: Authentication__EmailVerification__PublicUrl
        sync: false
      - key: Frontend__AllowedOrigins__0
        sync: false
      - key: Sentry__Dsn
        sync: false
      - key: Sentry__Release
        sync: false
