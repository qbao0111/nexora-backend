name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-validation:
    name: Container build and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_container_tests
          POSTGRES_USER: nexora_tests
          POSTGRES_PASSWORD: nexora-tests-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_tests -d nexora_container_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check shell lifecycle regression
        run: |
          for script in scripts/container-entrypoint.sh deploy/deploy.sh scripts/tests/container-entrypoint-test.sh; do
            bash -n "$script"
          done
          bash scripts/tests/container-entrypoint-test.sh
      - name: Validate Compose and build image
        run: |
          set -euo pipefail
          cp deploy/.env.production.example deploy/.env.production
          NEXORA_IMAGE_TAG="$GITHUB_SHA" docker compose -f deploy/docker-compose.production.yml config --quiet
          docker build --platform linux/amd64 --tag nexora-container-test .
      - name: Smoke real image and migration bundle against disposable PostgreSQL
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f nexora-container-test >/dev/null 2>&1 || true
            docker network disconnect nexora-smoke "$POSTGRES_SERVICE_ID" >/dev/null 2>&1 || true
            docker network rm nexora-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # No external provider traffic: internal bridge has no outbound route.
          docker network create --internal nexora-smoke
          docker network connect --alias postgres-test nexora-smoke "$POSTGRES_SERVICE_ID"
          docker run -d --name nexora-container-test --network nexora-smoke -p 127.0.0.1:10000:10000 \
            --env-file deploy/.env.production \
            -e 'ConnectionStrings__Postgres=Host=postgres-test;Database=nexora_container_tests;Username=nexora_tests;Password=nexora-tests-password' \
            -e Features__Ai=true -e Ai__Provider=deepseek \
            -e Ai__DeepSeek__ApiKey=test-only-not-used \
            -e Features__Payment=true -e Billing__Payment__Provider=payos \
            -e Billing__Payos__ClientId=test-only-client-id \
            -e Billing__Payos__ApiKey=test-only-api-key \
            -e Billing__Payos__ChecksumKey=test-only-checksum-key \
            -e Features__Upload=true -e Storage__Provider=r2 \
            nexora-container-test
          for (( i=0; i<90; i++ )); do
            if curl --fail --silent --output /dev/null http://localhost:10000/api/v1/health; then break; fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://localhost:10000/health/live
          curl --fail --silent --output /dev/null http://localhost:10000/api/v1/health
          docker top nexora-container-test -eo pid,args | grep -q 'dotnet ./api/Nexora.Api.dll'
          docker top nexora-container-test -eo pid,args | grep -q 'dotnet ./worker/Nexora.Worker.dll'
          [[ "$(docker exec nexora-container-test id -u)" != 0 ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:10000/swagger/index.html)" == 404 ]]
          docker stop --time 60 nexora-container-test >/dev/null
          [[ "$(docker inspect --format '{{.State.ExitCode}}' nexora-container-test)" == 0 ]]
  build-test-checks:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_tests
          POSTGRES_USER: nexora_tests
          POSTGRES_PASSWORD: nexora-tests-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_tests -d nexora_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NEXORA_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=nexora_tests;Username=nexora_tests;Password=nexora-tests-password
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Nexora.slnx

      - name: Build solution
        run: dotnet build Nexora.slnx --configuration Release --no-restore --nologo

      - name: Run unit tests
        run: dotnet test tests/Nexora.UnitTests/Nexora.UnitTests.csproj --configuration Release --no-build --no-restore

      - name: Run integration tests
        run: dotnet test tests/Nexora.IntegrationTests/Nexora.IntegrationTests.csproj --configuration Release --no-build --no-restore

      - name: Verify EF Core migration model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Nexora.Data/Nexora.Data.csproj
          --startup-project src/Nexora.Api/Nexora.Api.csproj
          --configuration Release
          --no-build

      - name: Audit NuGet vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          audit_file="${RUNNER_TEMP}/nuget-vulnerabilities.json"
          dotnet package list --project Nexora.slnx --vulnerable --include-transitive --format json --output-version 1 --no-restore > "${audit_file}"

          vulnerable_count="$(jq '[.projects[]?.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0)] | length' "${audit_file}")"
          if (( vulnerable_count > 0 )); then
            echo "Known vulnerable NuGet packages detected:"
            jq -r '.projects[]?.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0) | . as $package | .vulnerabilities[] | "\($package.id) \($package.resolvedVersion): \(.severity) \(.advisoryurl)"' "${audit_file}"
            exit 1
          fi

          echo "No known vulnerable NuGet packages detected."

      - name: Verify style and analyzers for changed C# files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_sha="${CURRENT_SHA}"
          base_sha=""

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] &&
               git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            base_sha="${PUSH_BEFORE_SHA}"
          elif parent_sha="$(git rev-parse "${CURRENT_SHA}^" 2>/dev/null)"; then
            base_sha="${parent_sha}"
          fi

          changed_file_list="${RUNNER_TEMP}/changed-csharp-files"
          if [[ -n "${base_sha}" ]]; then
            git diff --name-only --diff-filter=ACMR -z "${base_sha}" "${head_sha}" -- '*.cs' > "${changed_file_list}"
          else
            git ls-tree -r --name-only -z "${head_sha}" -- '*.cs' > "${changed_file_list}"
          fi

          declare -a changed_files=()
          mapfile -d '' changed_files < "${changed_file_list}"
          if (( ${#changed_files[@]} == 0 )); then
            echo "No added or modified C# files require format verification."
            exit 0
          fi

          printf 'Checking format: %s\n' "${changed_files[@]}"
          dotnet format Nexora.slnx style --verify-no-changes --no-restore --include "${changed_files[@]}"
          dotnet format Nexora.slnx analyzers --verify-no-changes --no-restore --include "${changed_files[@]}"

      - name: Verify tracked repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          tracked_changes="$(git status --porcelain --untracked-files=no)"
          if [[ -n "${tracked_changes}" ]]; then
            echo "CI commands modified tracked files:"
            git status --short --untracked-files=no
            exit 1
          fi
